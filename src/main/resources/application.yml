spring:
  application:
    name: interview-question-bank
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/interview_questions}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

app:
  similarity-threshold: ${SIMILARITY_THRESHOLD:0.82}
  embedding-dimensions: ${EMBEDDING_DIMENSIONS:256}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
